[gcode_macro START_PRINT]
gcode:
 #   {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set BED = params.BED|default(60)|float %}
 #   {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(190)|float %}
    # Start bed heating
    M140 S{BED}
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0
    # Home the printer
    G28

    G92 E0

    BED_MESH_CALIBRATE ADAPTIVE=1 ; Run full bed mesh
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Move to X Y 0
    G1 X0.0 Y0.0 F5000.0
    # Wait for bed to reach temperature
    M190 S{BED}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER}
#    VORON_PURGE

    #G1 Z2.0 F3000                    ; Move Z Axis up little to prevent scratching of Heat Bed
    #G1 X4.1 Y20 Z0.3 F5000.0         ; Move to start position
    #M117 Purging
    #G1 X4.1 Y200.0 Z0.3 F1500.0 E15  ; Draw the first line
    #G1 X4.4 Y200.0 Z0.3 F5000.0      ; Move to side a little
    #G1 X4.4 Y20 Z0.3 F1500.0 E30     ; Draw the second line
    #G92 E0                           ; Reset Extruder
    #M117
    #G1 Z2.0 F3000                    ; Move Z Axis up little to prevent scratching of Heat Bed
    #G1 X5 Y20 Z0.3 F5000.0           ; Move over to prevent blob squish